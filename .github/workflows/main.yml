name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Platform Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libssl-dev zlib1g-dev libdb5.3-dev \
          libexpat1-dev libffi-dev libgdbm-dev liblzma-dev libncurses5-dev \
          libreadline-dev libsqlite3-dev libssl-dev libbz2-dev uuid-dev openjdk-17-jdk

    - name: Set up Android SDK and Accept Licenses
      uses: android-actions/setup-android@v3

    - name: Accept Android Licenses Manually
      run: |
        yes | sdkmanager --licenses || true

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install buildozer cython==0.29.33 kivy

    - name: Build with Buildozer
      run: |
        # Bu əmr Buildozer-in öz lisenziya yoxlamasını keçirir
        buildozer android debug
      env:
        TERM: xterm
        GRADLE_OPTS: "-Dorg.gradle.daemon=false"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: zr4xchess-apk
        path: bin/*.apk
