name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Platform Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libssl-dev zlib1g-dev libdb5.3-dev \
          libexpat1-dev libffi-dev libgdbm-dev liblzma-dev libncurses5-dev \
          libreadline-dev libsqlite3-dev libssl-dev libbz2-dev uuid-dev

    - name: Find and Link AIDL Automatically
      run: |
        # Sistemdəki aidl faylını harada olursa olsun tapır və bura bağlayır
        AIDL_PATH=$(find $ANDROID_HOME/build-tools -name aidl -type f | head -n 1)
        if [ -n "$AIDL_PATH" ]; then
          sudo ln -s "$AIDL_PATH" /usr/local/bin/aidl
          echo "AIDL tapıldı və bağlandı: $AIDL_PATH"
        else
          echo "AIDL tapılmadı, standart alətlər quraşdırılır..."
          sudo apt-get install -y aidl
        fi

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install buildozer cython==0.29.33 kivy

    - name: Build with Buildozer
      run: |
        buildozer android debug
      env:
        TERM: xterm

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: zr4xchess-apk
        path: bin/*.apk
